[tools]
bun = "1.4.4"
node = "24.22.1" # same version as the Dockerfile (node:24.22.1-alpine)

[hooks]
postinstall = { task = "install" }

[tasks.install]
description = "install dependencies"
run = "bun install"

[tasks.build]
description = "build the app (CI: no auth, CI env schema)"
env = { APP_MODE = "ci", AUTH_MODE = "none" }
run = "bunx nuxt build"

[tasks.ci-check]
description = "lint and format check"
run = "bunx biome ci ."
