[tools]
# TEMPORARY until 2026-10-29: bun 1.4.4 fixes CVE-2026-111497 (Brotli decoder) but is younger than
# the 7-day cooldown. The weekly dependency routine deletes this comment once 1.4.4 is 7 days old.
bun = "1.4.4"
node = "24.22.1" # same version as the Dockerfile (node:24.22.1-alpine)

[hooks]
postinstall = { task = "install" }

[tasks.install]
description = "install dependencies"
run = "bun install"

[tasks.build]
description = "build the app (CI: no auth, CI env schema)"
env = { APP_MODE = "ci", AUTH_MODE = "none" }
run = "bunx nuxt build"

[tasks.ci-check]
description = "lint and format check"
run = "bunx biome ci ."
