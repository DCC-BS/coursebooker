variables:
  SUBDOMAIN: kurse

stages:
  - test
  - production

.deploy:
  script:
    - cd /opt/apps/ki/$CI_PROJECT_NAME
    - git remote set-url origin $CI_REPOSITORY_URL
    - git fetch
    - git checkout $CI_COMMIT_BRANCH
    - git pull
    - docker-compose down
    - cp Dockerfile.template Dockerfile
    - sed -i "s/PROXY_USER/$PROXY_USR/g" Dockerfile
    - sed -i "s/PROXY_PWD/$PROXY_PWD/g" Dockerfile
    - find . -type d -exec chmod 755 {} \;
    - find . -type f -exec chmod 644 {} \;
    - docker-compose build
    - docker-compose up -d

deploy-to-test:
  stage: test
  extends: .deploy
  environment:
    name: test_env
    url: https://$SUBDOMAIN.pdstatasvtapp04.pd.intranet.bs.ch/
    on_stop: stop_test
  tags:
    - app04-shell

deploy-to-prod:
  stage: production
  when: manual
  allow_failure: false
  extends: .deploy
  environment:
    name: prod_env
    url: https://$SUBDOMAIN.stata.pd.intranet.bs.ch/
    on_stop: stop_production
  tags:
    - app05-shell

.stop:
  script:
    - cd /opt/apps/ki/$CI_PROJECT_NAME
    - docker-compose down
  when: manual

stop_test:
  stage: test
  extends: .stop
  environment:
    name: test_env
    action: stop
  tags:
    - app04-shell

stop_production:
  stage: production
  extends: .stop
  environment:
    name: prod_env
    action: stop
  tags:
    - app05-shell
