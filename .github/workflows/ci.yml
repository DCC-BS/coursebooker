name: Build & Test

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    frontend-ci:
        # Shared CI: tools from mise.toml, then `mise run build` and `mise run ci-check`
        uses: DCC-BS/ci-workflows/.github/workflows/ci.yml@4594d0b9ddf95dcd54c25e599f927d5a23ae7950 # v10.0.6
        permissions:
            contents: read
            pull-requests: write
