name: Build & Test

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    frontend-ci:
        # Shared CI: tools from mise.toml, then `mise run build` and `mise run ci-check`
        uses: DCC-BS/ci-workflows/.github/workflows/ci.yml@e4b0133a84dbb31d57dd2389f22fce8b85cf55b7 # v10.0.4
        permissions:
            contents: read
            pull-requests: write
