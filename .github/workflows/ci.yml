name: Build & Test

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    frontend-ci:
        # Shared CI: tools from mise.toml, then `mise run build` and `mise run ci-check`
        uses: DCC-BS/ci-workflows/.github/workflows/ci.yml@8b031be53aee5210c6b392115bd941c80e798d60 # v10.0.1
        permissions:
            contents: read
            pull-requests: write
